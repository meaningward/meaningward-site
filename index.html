<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meaningward — reflections on presence & the quiet mind</title>
<meta name="description" content="Meaningward — reflections on presence, the ego, and the quiet mind. Daily contemplative quote-cards on Instagram, Pinterest, YouTube and TikTok." />
<!-- PINTEREST_VERIFY: replace the next line with the exact <meta name="p:domain_verify" ...> tag Pinterest gives you -->
<!-- <meta name="p:domain_verify" content="PASTE_CODE_HERE"/> -->
<style>
  :root{ --bg:#0b1020; --bg2:#131a33; --ink:#e8ecf6; --muted:#9aa6c4; --accent:#c9a44c; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2445 0%, transparent 60%),
      radial-gradient(800px 500px at 80% 120%, #201a33 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; min-height:100%;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:8vh 24px 6vh; max-width:720px; margin:0 auto; }
  .mark{ letter-spacing:.34em; text-transform:uppercase; font-size:13px; color:var(--accent);
    margin-bottom:28px; }
  h1{ font-family:Georgia,"Times New Roman",serif; font-weight:500; font-size:clamp(34px,7vw,60px);
    line-height:1.15; margin-bottom:22px; }
  .lede{ color:var(--muted); font-size:clamp(16px,2.4vw,19px); max-width:34ch; margin:0 auto 40px; }
  .socials{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-bottom:8px; }
  .socials a{ color:var(--ink); text-decoration:none; border:1px solid rgba(201,164,76,.35);
    padding:11px 20px; border-radius:999px; font-size:15px; transition:.2s; }
  .socials a:hover{ border-color:var(--accent); background:rgba(201,164,76,.10); }
  footer{ text-align:center; padding:28px 24px 40px; color:var(--muted); font-size:13px; }
  footer a{ color:var(--muted); text-decoration:none; border-bottom:1px solid rgba(154,166,196,.3); }
  footer a:hover{ color:var(--ink); }
  .dot{ margin:0 10px; opacity:.5; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark">Meaningward</div>
    <h1>Reflections on presence, the ego &amp; the quiet mind.</h1>
    <p class="lede">A daily practice of stillness — contemplative words, one at a time. Stillness is just a start.</p>
    <nav class="socials">
      <a href="https://www.instagram.com/meaningward/" rel="me">Instagram</a>
      <a href="https://www.pinterest.com/meaningward/" rel="me">Pinterest</a>
      <a href="https://www.youtube.com/@meaningward" rel="me">YouTube</a>
      <a href="https://www.tiktok.com/@meaningward" rel="me">TikTok</a>
    </nav>
  </main>
  <footer>
    <a href="/privacy">Privacy Policy</a>
    <span class="dot">·</span>
    <a href="/terms">Terms of Service</a>
    <span class="dot">·</span>
    <a href="mailto:meaningward@gmail.com">meaningward@gmail.com</a>
  </footer>
</body>
</html>
