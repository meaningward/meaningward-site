<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTok authorization — Meaningward</title>
<style>
  body{ background:#0b1020; color:#e8ecf6; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; padding:24px; text-align:center; }
  .box{ max-width:560px; }
  h1{ font-family:Georgia,serif; font-weight:500; font-size:26px; margin-bottom:10px; }
  p{ color:#9aa6c4; margin:0 0 18px; }
  code{ display:block; background:#131a33; border:1px solid rgba(201,164,76,.35); color:#c9a44c;
    padding:16px; border-radius:12px; font-size:15px; word-break:break-all; margin-bottom:14px; }
  button{ background:#c9a44c; color:#0b1020; border:0; padding:12px 22px; border-radius:999px; font-size:15px; cursor:pointer; }
  .err{ color:#e88; }
</style>
</head>
<body>
  <div class="box">
    <h1>Authorization received</h1>
    <p>Copy this code and paste it back to continue setup.</p>
    <code id="code">…</code>
    <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button>
    <p id="state" style="margin-top:16px;font-size:12px;"></p>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var code = q.get('code'); var err = q.get('error'); var st = q.get('state');
    var el = document.getElementById('code');
    if (err) { el.className='err'; el.textContent = 'Error: ' + err + ' — ' + (q.get('error_description')||''); }
    else if (code) { el.textContent = code; }
    else { el.textContent = 'No code in URL.'; }
    if (st) document.getElementById('state').textContent = 'state: ' + st;
  </script>
</body>
</html>
